# Собирает сайт и публикует на GitHub Pages.
# Запускается при каждом пуше в рабочую ветку и вручную кнопкой Run workflow.
#
# Один раз перед первым запуском: Settings -> Pages -> Source -> GitHub Actions.

name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/phuket-villas-catalog-site-xa66z9]
  workflow_dispatch:

# Разрешения, которые нужны экшену публикации
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: если пушнули дважды, публикуем последний
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Собрать статику
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: /elizabeth
        run: npm run build

      # Ссылки на файлы прописаны от корня (/fonts/..., /photos/...), а на
      # project-странице сайт живёт в подпапке /elizabeth.
      #
      # Ловушка: минификатор CSS переписывает image-set(url("/photos/x.webp"))
      # в image-set("/photos/x.webp" 1x) — без обёртки url(). Поэтому ищем не
      # по url(, а по любому символу кавычки или скобки перед путём.
      - name: Поправить пути к файлам под подпапку
        run: |
          set -e
          find out \( -name '*.css' -o -name '*.html' -o -name '*.js' \) -print0 \
            | xargs -0 --no-run-if-empty sed -i -E 's#(["'"'"'(=])/(fonts|photos)/#\1/elizabeth/\2/#g'

          echo "--- проверка ---"
          if grep -rqE '["'"'"'(=]/(fonts|photos)/' out; then
            echo "Остались ссылки без префикса:"
            grep -rhoE '.{20}["'"'"'(=]/(fonts|photos)/[^"'"'"')]*' out | head -5
            exit 1
          fi
          echo "все ссылки получили префикс /elizabeth"

          # Файлы должны реально лежать там, куда теперь ведут ссылки
          for f in $(grep -rhoE '/elizabeth/(fonts|photos)/[A-Za-z0-9._-]+' out | sort -u); do
            test -f "out${f#/elizabeth}" || { echo "НЕТ ФАЙЛА: $f"; exit 1; }
          done
          echo "все файлы на месте"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
